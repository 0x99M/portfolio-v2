<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Delius&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            position: relative;
        }
        
        .error-content {
            max-width: 600px;
            padding: var(--space-xl);
            background: var(--color-surface);
            border: var(--border-width) solid var(--color-border);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-xl);
            position: relative;
            z-index: 2;
        }
        
        .error-code {
            font-size: clamp(6rem, 15vw, 10rem);
            font-weight: 900;
            line-height: 1;
            margin-bottom: 1rem;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
        }
        
        .error-code::after {
            content: '404';
            position: absolute;
            top: 4px;
            left: 4px;
            z-index: -1;
            color: var(--color-border);
            -webkit-text-fill-color: var(--color-border);
        }
        
        .error-title {
            font-size: 2rem;
            margin-bottom: 1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -0.02em;
        }
        
        .error-description {
            color: var(--color-text-light);
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }
        
        .error-links {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .error-emoji {
            position: absolute;
            font-size: 4rem;
            opacity: 0.1;
            animation: float-emoji 20s ease-in-out infinite;
        }
        
        .error-emoji:nth-child(1) { top: 10%; left: 10%; animation-delay: 0s; }
        .error-emoji:nth-child(2) { top: 20%; right: 15%; animation-delay: 5s; }
        .error-emoji:nth-child(3) { bottom: 20%; left: 20%; animation-delay: 10s; }
        .error-emoji:nth-child(4) { bottom: 10%; right: 10%; animation-delay: 15s; }
        
        @keyframes float-emoji {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(15deg); }
            66% { transform: translate(-20px, 20px) rotate(-10deg); }
        }
    </style>
</head>
<body>
    <!-- Floating Background Shapes -->
    <div class="floating-shape"></div>
    <div class="floating-shape"></div>
    
    <div class="error-page">
        <!-- Fun floating emojis -->
        <span class="error-emoji">🤔</span>
        <span class="error-emoji">🔍</span>
        <span class="error-emoji">🗺️</span>
        <span class="error-emoji">❓</span>
        
        <div class="error-content" data-animate>
            <div class="error-code">404</div>
            <h1 class="error-title">Page Not Found</h1>
            <p class="error-description">
                The page you're looking for doesn't exist or has been moved.
            </p>
            <div class="error-links">
                <a href="index.html" class="btn primary">Go Home</a>
                <a href="projects.html" class="btn ghost">View Projects</a>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
