<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projects - Anonymous Developer</title>
    <meta name="description" content="My portfolio of projects and work" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Floating Background Shapes -->
    <div class="floating-shape"></div>
    <div class="floating-shape"></div>

    <!-- Navbar -->
    <div class="section-indicator">
      <a href="index.html" class="logo-box">
        <img src="favicon.svg" alt="Logo" class="logo-img" />
      </a>
      <button
        class="nav-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="primary-navigation"
        aria-label="Toggle navigation"
      >
        <span class="nav-toggle-bar"></span>
      </button>
      <div class="nav-links" id="primary-navigation">
        <div class="nav-links-primary">
          <a href="index.html#hero" class="indicator-item">Home</a>
          <a href="index.html#experience" class="indicator-item">Experience</a>
          <a href="index.html#skills" class="indicator-item">Skills</a>
          <a href="index.html#education" class="indicator-item">Education</a>
        </div>
        <a
          href="projects.html"
          class="indicator-item indicator-item-projects is-active"
        >
          Projects
        </a>
      </div>
    </div>

    <main>
      <section class="section hero projects-hero" data-animate>
        <div class="container narrow">
          <p class="eyebrow">Selected work</p>
          <h1>Projects</h1>
          <p class="lead">
            A living archive of products, experiments, and client work. Ideal
            for verification by partners and payment providers.
          </p>
        </div>
      </section>

      <section class="section" data-animate>
        <div class="container">
          <div id="projects-grid" class="project-grid">
            <!-- Projects will be loaded here -->
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>Built with intention · 2025</p>
        <a href="mailto:me@0x99m.com">me@0x99m.com</a>
      </div>
    </footer>

    <script src="script.js"></script>
    <script>
      (function () {
        const projectsData = {
          projects: [
            {
              title: "Videos.Recipes",
              description:
                "AI-powered SaaS platform that converts YouTube cooking videos into structured, searchable recipes. Features tiered subscription model and real-time processing.",
              image: "images/videos-recipes.png",
              link: "https://videos.recipes",
              technologies: [
                "Next.js",
                "TypeScript",
                "PostgreSQL",
                "DrizzleORM",
                "Clerk Auth",
                "Railway",
              ],
            },
          ],
        };

        const projectsGrid = document.getElementById("projects-grid");

        if (!projectsData.projects || projectsData.projects.length === 0) {
          projectsGrid.innerHTML =
            '<p class="muted">No projects available yet. Check back soon.</p>';
          return;
        }

        projectsGrid.innerHTML = projectsData.projects
          .map(
            (project, index) => `
                  <article class="project-card" data-animate style="--delay:${
                    index * 80
                  }ms">
                      <div class="project-media">
                          <img src="${project.image}" alt="${
              project.title
            }" loading="lazy" />
                      </div>
                      <div class="project-body">
                          <h2>${project.title}</h2>
                          <p>${project.description}</p>
                          ${
                            project.technologies
                              ? `
                              <ul class="project-tags">
                                  ${project.technologies
                                    .map((tech) => `<li>${tech}</li>`)
                                    .join("")}
                              </ul>
                          `
                              : ""
                          }
                          <a class="project-link" href="${
                            project.link
                          }" target="_blank" rel="noopener noreferrer">
                              View project
                          </a>
                      </div>
                  </article>
              `
          )
          .join("");

        if (typeof window.refreshAnimations === "function") {
          window.refreshAnimations();
        }
      })();
    </script>
  </body>
</html>
